<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notely — Professional Notes</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Notely">
  
  <!-- Manifest Link -->
  <link rel="manifest" href="/testings/manifest.json">
  
  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/testings/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/testings/icon-512.png">
  <link rel="apple-touch-icon" href="/testings/icon-192.png">

  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --text: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
      --radius: 12px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --accent: #818cf8;
      --accent-hover: #6366f1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: all var(--transition);
    }

    .app-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      font-size: 1.2rem;
    }

    .composer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-md);
    }

    .composer-input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 1rem;
      padding: 10px 0;
      outline: none;
      color: var(--text);
      font-family: inherit;
      resize: none;
    }

    .composer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .char-count {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .post-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .note-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .note-header {
      display: flex;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .note-info {
      flex: 1;
    }

    .note-topic {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .note-timestamp {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .note-content {
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .note-actions {
      display: flex;
      gap: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 5px 10px;
      border-radius: 6px;
      transition: all var(--transition);
      font-family: inherit;
    }

    .action-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .edit-area {
      margin-top: 15px;
    }

    .edit-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      min-height: 80px;
      outline: none;
    }

    .edit-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      justify-content: flex-end;
    }

    .save-btn, .cancel-btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      font-family: inherit;
    }

    .save-btn {
      background: var(--accent);
      color: white;
      border: none;
    }

    .cancel-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
    }

    @media (max-width: 600px) {
      .app-container {
        padding: 10px;
      }
      .note-card {
        padding: 15px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">Notely</div>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </header>

    <div class="composer">
      <textarea class="composer-input" id="composerInput" placeholder="What's on your mind? Create a new topic..." rows="2"></textarea>
      <div class="composer-actions">
        <span class="char-count" id="charCount">0 / 280</span>
        <button class="post-btn" id="postBtn">Post Note</button>
      </div>
    </div>

    <div class="feed" id="feed"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/testings/service-worker.js')
          .then(reg => console.log('SW registered'))
          .catch(err => console.log('SW registration failed'));
      });
    }

    const STORAGE_KEY = 'notely_notes_final';
    const THEME_KEY = 'notely_theme';

    function loadNotes() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveNotes(notes) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function loadTheme() {
      const theme = localStorage.getItem(THEME_KEY);
      if (theme) document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem(THEME_KEY, next);
      document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
    });

    function formatDate(iso) {
      const d = new Date(iso);
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      let h = d.getHours();
      const m = d.getMinutes().toString().padStart(2,'0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} at ${h}:${m} ${ampm}`;
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substring(2,6);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderNotes(notes) {
      const feed = document.getElementById('feed');
      if (!notes.length) {
        feed.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">No notes yet. Create your first note above!</div></div>';
        return;
      }
      const sorted = [...notes].sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      feed.innerHTML = sorted.map(note => `
        <div class="note-card" data-id="${note.id}">
          <div class="note-header">
            <div class="avatar">${escapeHtml((note.topic||'N').substring(0,2).toUpperCase())}</div>
            <div class="note-info">
              <div class="note-topic">${escapeHtml(note.topic||'Untitled')}</div>
              <div class="note-timestamp">
                📅 Created: ${escapeHtml(formatDate(note.createdAt))}<br>
                🔄 Updated: ${escapeHtml(formatDate(note.updatedAt))}
              </div>
            </div>
          </div>
          <div class="note-content">${escapeHtml(note.content||'')}</div>
          <div class="note-actions">
            <button class="action-btn" onclick="startEdit('${note.id}')">✏️ Edit</button>
            <button class="action-btn" onclick="deleteNote('${note.id}')">🗑️ Delete</button>
          </div>
          <div class="edit-area" id="edit-${note.id}" style="display:none">
            <textarea class="edit-input" id="input-${note.id}">${escapeHtml(note.content||'')}</textarea>
            <div class="edit-actions">
              <button class="cancel-btn" onclick="cancelEdit('${note.id}')">Cancel</button>
              <button class="save-btn" onclick="saveEdit('${note.id}')">Save</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    window.startEdit = (id) => {
      document.getElementById(`edit-${id}`).style.display = 'block';
      document.querySelector(`[data-id="${id}"] .note-content`).style.display = 'none';
      document.querySelector(`[data-id="${id}"] .note-actions`).style.display = 'none';
    };

    window.cancelEdit = (id) => {
      document.getElementById(`edit-${id}`).style.display = 'none';
      document.querySelector(`[data-id="${id}"] .note-content`).style.display = 'block';
      document.querySelector(`[data-id="${id}"] .note-actions`).style.display = 'flex';
    };

    window.saveEdit = (id) => {
      const notes = loadNotes();
      const idx = notes.findIndex(n => n.id === id);
      if (idx !== -1) {
        notes[idx].content = document.getElementById(`input-${id}`).value;
        notes[idx].updatedAt = new Date().toISOString();
        saveNotes(notes);
        renderNotes(notes);
      }
    };

    window.deleteNote = (id) => {
      if (confirm('Delete this note?')) {
        saveNotes(loadNotes().filter(n => n.id !== id));
        renderNotes(loadNotes());
      }
    };

    document.getElementById('postBtn').addEventListener('click', () => {
      const input = document.getElementById('composerInput');
      const content = input.value.trim();
      if (!content) return;
      const notes = loadNotes();
      notes.push({
        id: generateId(),
        topic: content.split('\n')[0].substring(0,50),
        content,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      });
      saveNotes(notes);
      input.value = '';
      renderNotes(notes);
    });

    document.getElementById('composerInput').addEventListener('input', (e) => {
      document.getElementById('charCount').textContent = `${e.target.value.length} / 280`;
    });

    loadTheme();
    renderNotes(loadNotes());
  </script>
</body>
</html>
