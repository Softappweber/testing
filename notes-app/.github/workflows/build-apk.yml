name: Build Notely APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install Cordova
      run: |
        npm install -g cordova
    
    - name: Create Project
      run: |
        cordova create app com.notely.app "Notely"
        cd app
        cordova platform add android
    
    - name: Copy Files from notes-app ONLY
      run: |
        echo "Copying from notes-app folder..."
        cp notes-app/index.html app/www/
        cp notes-app/manifest.json app/www/
        cp notes-app/service-worker.js app/www/
        cp notes-app/icon-192.png app/www/ 2>/dev/null || echo "icon192 missing"
        cp notes-app/icon-512.png app/www/ 2>/dev/null || echo "icon512 missing"
        echo "Files in app/www:"
        ls -la app/www/
    
    - name: Build APK
      run: |
        cd app
        cordova build android --debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NOTELY-APK
        path: app/platforms/android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
