name: Build Notely APK Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install Cordova
      run: |
        npm install -g cordova
    
    - name: Create Project
      run: |
        cordova create app com.notely.app "Notely"
        cd app
        cordova platform add android
    
    - name: Copy ONLY notes-app files
      run: |
        cd notes-app
        cp index.html ../app/www/
        cp manifest.json ../app/www/
        cp service-worker.js ../app/www/
        cp icon-192.png ../app/www/
        cp icon-512.png ../app/www/
        cd ..
        echo "Files copied:"
        ls -la app/www/
    
    - name: Build APK
      run: |
        cd app
        cordova build android --debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NOTELY-APK-ONLY
        path: app/platforms/android/app/build/outputs/apk/debug/*.apk
