name: Build Notely APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install Cordova
      run: |
        npm install -g cordova
    
    - name: Create Project
      run: |
        cordova create app com.notely.app "Notely"
        cd app
        cordova platform add android
    
    - name: Copy Files
      run: |
        cp notes-app/index.html app/www/index.html
        cp notes-app/manifest.json app/www/manifest.json 2>/dev/null || echo "no manifest"
        cp notes-app/service-worker.js app/www/service-worker.js 2>/dev/null || echo "no sw"
        ls -la app/www/
    
    - name: Build APK
      run: |
        cd app
        cordova build android
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NOTELY-APK
        path: app/platforms/android/app/build/outputs/apk/debug/*.apk
