name: Build Notely APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install Cordova
      run: |
        npm install -g cordova
        cordova --version
    
    - name: Create Project
      run: |
        cordova create app com.notely.app "Notely"
        cd app
        cordova platform add android
    
    - name: Copy Files
      run: |
        cp index.html app/www/ 2>/dev/null || echo "index.html not found"
        cp manifest.json app/www/ 2>/dev/null || echo "manifest not found"
        cp service-worker.js app/www/ 2>/dev/null || echo "sw not found"
        cp *.png app/www/ 2>/dev/null || echo "no png"
        ls -la app/www/
    
    - name: Build APK
      run: |
        cd app
        cordova build android --debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NOTELY-APK
        path: app/platforms/android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
